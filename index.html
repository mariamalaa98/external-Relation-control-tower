<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Andalusia Pulse — External Relations Control Tower</title>
<style>
:root{
  /* Andalusia Pulse palette */
  --espresso:#1C1411; --espresso-2:#241A15;
  --bronze:#96703F; --bronze-dp:#7E5C31; --bronze-lt:#F3EBDD; --bronze-ink:#7A5A2E;
  --gold:#C8A96A; --olive:#4E5B33;
  --page:#FFFDFA; --panel:#FFFFFF; --side:#FCFAF7;
  --line:#EDE7DD; --line-2:#F4F0E9; --tanhead:#F0E9DC; --hover:#FBF8F3;
  --ink:#1E1814; --muted:#7C736A; --label:#8A7B5F; --ctl:#D9D2C7;
  --cream:#FDF8EE;
  /* semantic */
  --ok:#2A6B45; --okbg:#E6F0E9; --warn:#8A5B00; --warnbg:#FAF0DC;
  --bad:#9E2626; --badbg:#F8E6E6; --info:#2A4E7A; --infobg:#E9EEF6;
  --lav:#5B4E8A; --lavbg:#EEEBF7;
}
*{box-sizing:border-box}
body{margin:0;min-width:1280px;background:var(--page);color:var(--ink);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px}
.mono,.v,td .mono{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
header{height:46px;background:var(--espresso);color:#fff;display:flex;align-items:center;
  padding:0 20px;gap:26px;position:sticky;top:0;z-index:40}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px}
.toptabs{display:flex;gap:6px}
.toptab{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:#C6BBAD;cursor:pointer;
  border:none;background:transparent;font-family:inherit}
.toptab:hover{color:#fff;background:rgba(255,255,255,.06)}
.toptab.on{background:var(--bronze);color:#fff}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.hdr-icon{opacity:.7;font-size:14px;cursor:pointer}
.hdr-icon:hover{opacity:1}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--bronze);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:flex;min-height:calc(100vh - 46px)}
aside{width:248px;flex:0 0 248px;background:var(--side);border-right:1px solid var(--line);padding-bottom:40px}
.profile{display:flex;gap:11px;align-items:center;padding:18px 16px 20px}
.profile .ini{width:34px;height:34px;border-radius:8px;background:var(--espresso);color:var(--gold);
  font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.profile .t{font-size:14px;font-weight:600;line-height:1.2}
.profile .r{font-size:11px;color:var(--muted);margin-top:3px}
.grouplabel{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--label);
  font-weight:600;padding:18px 16px 8px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 16px;font-size:14px;font-weight:500;
  color:#4A423B;cursor:pointer;border-left:3px solid transparent}
.nav:hover{background:var(--hover)}
.nav.active{background:var(--bronze-lt);border-left-color:var(--bronze);color:var(--ink);font-weight:600}
.nav .ico{width:16px;text-align:center;font-size:13px;opacity:.75}
.dot{width:7px;height:7px;border-radius:50%;background:#3FA168;margin-left:auto;
  box-shadow:0 0 0 3px rgba(63,161,104,.18)}
main{flex:1;padding:22px 28px 60px}
.screen{display:none}
.screen.active{display:block}

/* ---------- page head + acting-as ---------- */
.pagehead{display:flex;align-items:flex-start;gap:18px;margin-bottom:16px}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.2px}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.pagehead .acts{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ---------- scope bar + callout ---------- */
.scope{display:flex;gap:26px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;margin-bottom:14px;flex-wrap:wrap}
.scope .f{display:flex;flex-direction:column;gap:6px}
.scope label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--label);font-weight:700}
.callout{background:var(--cream);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;
  padding:13px 16px;font-size:12.5px;color:var(--bronze-ink);line-height:1.6;margin-bottom:16px}
.callout b{color:#5E4520}

/* ---------- buttons ---------- */
.btn{border-radius:6px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid transparent;font-family:inherit;transition:.13s}
.btn-primary{background:var(--bronze);color:#fff}
.btn-primary:hover{background:var(--bronze-dp)}
.btn-outline{background:#fff;border-color:var(--ctl);color:var(--ink)}
.btn-outline:hover{background:var(--hover);border-color:var(--bronze)}
.btn-ghost{background:transparent;border:none;color:var(--muted);font-weight:500}
.btn-ghost:hover{color:var(--bronze)}
.btn-mini{padding:4px 10px;font-size:12px;border-radius:5px}
.btn-danger{background:#fff;color:var(--bad);border-color:#E7CDCD}

/* ---------- panels + kpi ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi{flex:1 1 0;min-width:158px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;cursor:pointer;position:relative;overflow:hidden;transition:.14s}
.kpi:hover{border-color:var(--bronze);box-shadow:0 3px 10px rgba(120,90,50,.09)}
.kpi::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--acc,var(--bronze))}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--label);font-weight:700}
.kpi .v{font-size:26px;font-weight:700;margin-top:9px;line-height:1;color:var(--acc,var(--ink));
  font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;color:var(--muted);margin-top:7px}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;margin-bottom:14px;align-items:center}
input[type=text],input[type=date],select{border:1px solid var(--ctl);background:#fff;border-radius:6px;
  padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink);min-width:158px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
input::placeholder{color:#A9A29A}
.fnote{font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- tables ---------- */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:560px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--tanhead);text-align:left;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.9px;color:var(--bronze-ink);font-weight:700;padding:11px 14px;
  white-space:nowrap;border-bottom:1px solid #E4DBC9}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.legal-row td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tbody tr.noresults,tbody tr.noresults:hover{background:#fff;cursor:default}
tbody tr.noresults td{color:var(--muted);text-align:center;padding:28px}
.link{color:var(--info);text-decoration:none;border-bottom:1px dotted var(--info);cursor:pointer}
.strong-bad{color:var(--bad);font-weight:700}

/* ---------- badges (Pulse pill style) ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.b-gold{background:var(--bronze-lt);color:var(--bronze-ink)}
.b-gray{background:#F1EEE9;color:#6B635A}
.b-brown{background:#EFE7DC;color:var(--bronze-ink)}
.b-plum{background:var(--lavbg);color:var(--lav)}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-info{background:var(--infobg);color:var(--info)}
.b-fill{background:var(--olive);color:#fff}
.pill-state{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid var(--ctl);color:var(--muted);background:#fff}

/* ---------- charts ---------- */
.two{display:flex;gap:14px;margin-bottom:14px}
.chartcard{flex:1;padding:18px}
.chartcard h3{margin:0 0 4px;font-size:14px;font-weight:600}
.chartcard .cs{font-size:12px;color:var(--muted);margin-bottom:18px}
.bars{display:flex;align-items:flex-end;gap:16px;height:186px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer}
.bar i{display:block;width:100%;border-radius:3px 3px 0 0;transition:.14s}
.bar:hover i{filter:brightness(1.12)}
.bar span{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
.bar b{font-size:12px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.donutwrap{display:flex;gap:22px;align-items:center;height:186px}
.donut{width:164px;height:164px;border-radius:50%;flex:0 0 164px;
  background:conic-gradient(var(--ok) 0 78%, var(--gold) 78% 91%, var(--bad) 91% 100%);
  display:flex;align-items:center;justify-content:center}
.donut::after{content:"88%";width:104px;height:104px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.legend{font-size:12px;line-height:2.1;color:#544B43}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.quick{display:flex;gap:12px}
.quicklink{flex:1;padding:15px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;
  border-left:3px solid var(--acc,var(--bronze));transition:.14s}
.quicklink:hover{background:var(--hover);border-color:var(--acc,var(--bronze))}
.quicklink .n{font-size:20px;font-weight:700;color:var(--acc,var(--ink));font-variant-numeric:tabular-nums}
.quicklink .x{font-size:12px;color:var(--muted)}
.quicklink .go{margin-left:auto;color:var(--bronze);font-weight:700}

/* ---------- calendar ---------- */
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.toggle button{border:none;background:#fff;padding:7px 16px;font:inherit;font-size:12px;font-weight:600;
  cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.toggle button:last-child{border-right:none}
.toggle button.on{background:var(--bronze);color:#fff}
.cal{padding:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.calgrid .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--label);
  font-weight:700;padding:4px 6px}
.day{min-height:84px;border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;background:#FDFCFA}
.day.empty{background:transparent;border-color:transparent}
.day.has{background:#fff;border-color:var(--line)}
.day .num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev{font-size:11px;margin-top:5px;display:flex;gap:6px;align-items:flex-start;line-height:1.3;cursor:pointer;
  padding:2px 4px;border-radius:4px}
.ev:hover{background:var(--bronze-lt)}
.ev i{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:4px}
.ph{border:1px dashed var(--ctl);border-radius:10px;padding:56px;text-align:center;color:var(--muted);background:#FDFCFA}

/* ---------- archive ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.doc{padding:15px;cursor:pointer;transition:.14s}
.doc:hover{border-color:var(--bronze);box-shadow:0 4px 12px rgba(120,90,50,.09)}
.thumb{height:100px;border-radius:7px;background:linear-gradient(160deg,#F7F2E8,#EDE5D6);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#B3A78E;margin-bottom:12px}
.doc .dn{font-size:13px;font-weight:600;line-height:1.35}
.doc .dm{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-bottom:none;
  border-radius:10px 10px 0 0;padding:6px 8px 0}
.tabs button{border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
  padding:10px 15px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--bronze-ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--bronze)}
.tabbody{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:18px}

/* ---------- switch ---------- */
.sw{width:34px;height:18px;border-radius:999px;background:#DCD5CA;position:relative;display:inline-block;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--olive)}
.sw.on::after{left:18px}

.sumbar{display:flex;gap:30px;padding:15px 18px;margin-top:14px;font-size:13px;align-items:center;
  border-left:3px solid var(--gold)}
.sumbar b{font-size:16px;font-variant-numeric:tabular-nums}
h2.sec{font-size:14px;font-weight:600;margin:22px 0 10px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(28,20,17,.34);opacity:0;pointer-events:none;transition:.18s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;background:#fff;z-index:60;
  transform:translateX(100%);transition:transform .22s ease;box-shadow:-4px 0 26px rgba(0,0,0,.14);
  display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);z-index:60;width:780px;
  max-width:calc(100vw - 80px);max-height:86vh;background:#fff;border-radius:12px;display:none;
  flex-direction:column;box-shadow:0 24px 60px rgba(28,20,17,.26);opacity:0;transition:.16s}
.modal.open{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1)}
.dh{background:var(--espresso);color:#fff;padding:15px 20px;display:flex;align-items:flex-start;gap:12px;
  border-radius:12px 12px 0 0}
.drawer .dh{border-radius:0}
.dh .t{font-size:15px;font-weight:600}
.dh .s{font-size:12px;opacity:.72;margin-top:3px}
.dh .x{margin-left:auto;background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1}
.db{padding:20px;overflow:auto;flex:1}
.df{border-top:1px solid var(--line);padding:13px 20px;display:flex;gap:9px;flex-wrap:wrap;background:#FCFAF7;
  border-radius:0 0 12px 12px}
.kv{display:grid;grid-template-columns:172px 1fr;gap:10px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 14px;font-size:12px}
.tl li::before{content:"";position:absolute;left:-23px;top:3px;width:9px;height:9px;border-radius:50%;
  background:var(--gold);border:2px solid #fff}
.tl b{display:block;font-size:13px}
.tl span{color:var(--muted)}
.att{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:7px;margin-bottom:8px;font-size:12px}
.att .fx{width:26px;height:26px;border-radius:5px;background:var(--bronze-lt);display:flex;align-items:center;justify-content:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--label);
  display:block;margin-bottom:5px;font-weight:700}
.form input,.form select,.form textarea{width:100%;min-width:0}
.form textarea{border:1px solid var(--ctl);border-radius:6px;padding:8px 10px;font-family:inherit;
  font-size:13px;color:var(--ink);resize:vertical}
.form textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
.form select:disabled{background:#F6F3EE;color:var(--muted)}
.exportbox{width:100%;height:230px;border:1px solid var(--ctl);border-radius:6px;padding:10px 12px;
  font-family:Consolas,"Courier New",monospace;font-size:11px;line-height:1.55;color:var(--ink);
  background:#FCFBF9;resize:vertical;white-space:pre;overflow:auto}
.exportbox:focus{outline:2px solid var(--gold);outline-offset:-1px}
.form .wide{grid-column:1 / -1}
.note{font-size:12px;color:var(--bronze-ink);margin-top:14px;padding:11px 14px;background:var(--cream);
  border-left:3px solid var(--gold);border-radius:0 6px 6px 0;line-height:1.6}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--espresso);
  color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:80;opacity:0;
  pointer-events:none;transition:.18s;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <span class="brand">Andalusia Pulse</span>
  <div class="toptabs" id="toptabs"></div>
  <div class="hdr-right">
    <span class="hdr-icon" data-act="search-hdr">⌕</span>
    <span class="hdr-icon" data-act="quickadd">＋</span>
    <span class="hdr-icon" data-act="settings">⚙</span>
    <span class="hdr-icon" data-act="help">?</span>
    <div class="avatar" data-act="profile">HG</div>
  </div>
</header>

<div class="shell">
  <aside>
    <div class="profile">
      <div class="ini">ER</div>
      <div>
        <div class="t">External Relations</div>
        <div class="r">Control Tower</div>
      </div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>

<div class="drawer" id="drawer">
  <div class="dh"><div><div class="t" id="dTitle"></div><div class="s" id="dSub"></div></div>
    <button class="x" data-act="close">✕</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</div>

<div class="modal" id="modal">
  <div class="dh"><div><div class="t" id="mTitle"></div><div class="s" id="mSub"></div></div>
    <button class="x" data-act="close">✕</button></div>
  <div class="db" id="mBody"></div>
  <div class="df" id="mFoot"></div>
</div>

<div id="toast"></div>
<script>
/* =========================================================================
   External Relations Control Tower — working prototype
   One mutable store (DB) + one render pass. Every action mutates DB and
   re-renders, so created / reassigned / escalated / closed records persist
   for the whole session. "Reset demo data" restores the seed.
   ========================================================================= */

const TODAY='2026-08-17';
const d=s=>new Date(s+'T00:00:00');
const diffDays=(a,b)=>Math.round((d(b)-d(a))/864e5);
const addDays=(s,n)=>{const x=d(s);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const fmt=s=>s?s:'—';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const uid=p=>p+'-'+(Math.random().toString(36).slice(2,6).toUpperCase());

const BU=['Andalusia Hospital – Smouha','Andalusia Hospital – El Maadi','Andalusia Hospital – Shallalat','Group – Head Office'];
const OWNERS=['Ahmed Salah','Mona ElSayed','Yasser Mahmoud','Nourhan Abdelrahman','Heba Kamal','Sara Fouad','Karim ElBadry'];
const SUPS=['Dr. Bassam Farid','Yasser Mahmoud','Mona ElSayed'];
const CATS=['Government','Insurance','Regulatory','Legal','Corporate','Partner'];
const PRIS=['Critical','High','Medium','Low'];
const DEPTS=['Government Relations','Legal Affairs','Revenue Cycle','Quality & Accreditation','Facilities','Pharmacy'];

/* ---------------- seed ---------------- */
function seed(){return {
 sla:[ /* category, priority, ack hours, resolve working days, basis */
  ['Government','Critical',4,2,'Working days'],['Government','High',8,5,'Working days'],
  ['Regulatory','Critical',4,2,'Working days'],['Regulatory','High',8,5,'Working days'],
  ['Legal','Critical',2,2,'Calendar days'],['Legal','High',4,3,'Calendar days'],
  ['Insurance','High',24,7,'Working days'],['Insurance','Medium',24,10,'Working days'],
  ['Corporate','Medium',24,10,'Working days'],['Partner','Low',48,14,'Working days']],

 comms:[
  c('COM-2026-0412','National Health Insurance Authority','Government','Facility re-accreditation site visit schedule','Ahmed Salah','Dr. Bassam Farid','Critical','2026-08-10','2026-08-12','In Progress',BU[0],{resp:'2026-08-12 16:20',respAction:'Acknowledged; documents in preparation'}),

let DB=seed();

/* ---------------- derived logic ---------------- */
const slaRow=(cat,pri)=>DB.sla.find(r=>r[0]===cat&&r[1]===pri);
function slaDays(cat,pri){const r=slaRow(cat,pri); if(r) return r[3];
  return {Critical:2,High:5,Medium:10,Low:14}[pri]||10;}
function slaState(r){
  if(r.status==='Closed') return diffDays(r.closed||r.due,r.due)>=0?'Within':'Breached';
  const left=diffDays(TODAY,r.due);
  return left<0?'Breached':left<=1?'At Risk':'Within';
}
const isOpen=r=>r.status!=='Closed';
const daysOver=r=>Math.max(0,-diffDays(TODAY,r.due));
const toExpiry=doc=>diffDays(TODAY,doc.expiry);
function docState(doc){
  if(doc.status==='Renewed') return 'Renewed';
  const t=toExpiry(doc);
  return t<0?'Expired':t<=90?'Expiring':'Active';
}
const commById=id=>DB.comms.find(x=>x.id===id);
const openEsc=()=>DB.esc.filter(e=>e.status==='Open');

function kpis(){
  const total=DB.comms.length, open=DB.comms.filter(isOpen).length;
  const over=DB.comms.filter(r=>isOpen(r)&&slaState(r)==='Breached').length;
  const closed=DB.comms.filter(r=>!isOpen(r));
  const within=closed.filter(r=>slaState(r)==='Within').length;
  const comp=closed.length?(within/closed.length*100):100;
  const ren=DB.docs.filter(x=>docState(x)==='Expiring').length;
  return {total,open,over,comp:comp.toFixed(1)+'%',esc:openEsc().length,ren};
}
function catCounts(){const m={};CATS.forEach(x=>m[x]=0);DB.comms.forEach(r=>m[r.cat]++);return m;}
function buCompliance(){
  return BU.map(bu=>{
    const rows=DB.comms.filter(r=>r.bu===bu);
    const w=rows.filter(r=>slaState(r)==='Within').length;
    const a=rows.filter(r=>slaState(r)==='At Risk').length;
    const br=rows.filter(r=>slaState(r)==='Breached').length;
    return {bu,n:rows.length,w,a,br,pct:rows.length?Math.round(w/rows.length*100):100};
  });
}

/* ---------------- audit derivations ---------------- */
const at=x=>new Date(x.replace(' ','T')+':00');
const hoursBetween=(a,z)=>(at(z)-at(a))/36e5;
const respHours=r=>r.resp?hoursBetween(r.recAt,r.resp):null;
const within24=r=>!!r.resp&&respHours(r)<=24;
function commCompliance(){
  const total=DB.comms.length, w=DB.comms.filter(within24).length;
  return {total,within:w,delayed:total-w,pct:total?(w/total*100).toFixed(1):'0.0'};
}
const NOTIFY_LEAD=120;                                   // 120 days before expiry
const notifStart=x=>addDays(x.expiry,-NOTIFY_LEAD);
const cycleStatus=x=>x.done?'Closed':(diffDays(TODAY,x.expiry)<0?'Overdue':'Open');
const inWindow=x=>{const t=diffDays(TODAY,x.expiry);return t>=0&&t<=NOTIFY_LEAD;};
const renewalDocs=()=>DB.docs;
const escStatus=e=>e.respAt?'Responded':'No Response';
const escLag=e=>e.respAt?hoursBetween(e.recvAt,e.respAt).toFixed(1)+' h':'—';
function weekStart(iso){const x=d(iso);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);
  return x.toISOString().slice(0,10);}
function weeklyCompletions(){
  const m={};
  DB.docs.filter(x=>x.done).forEach(x=>{const k=weekStart(x.done);(m[k]=m[k]||[]).push(x);});
  return Object.keys(m).sort().reverse().map(k=>({week:k,items:m[k]}));
}

    const tags=[...r.cells.join(' ').matchAll(/class="badge[^"]*">([^<]*)</g)]
      .map(m=>m[1].replace(/&amp;/g,'&').trim().toLowerCase()).join('|');
    return `<tr class="${r.cls||''}" data-date="${r.date||''}" data-tags="${tags}"`
      + (opts.set?` data-set="${opts.set}" data-key="${r.key}"`:'')+`>`
      + r.cells.map(x=>`<td>${x}</td>`).join('')+`</tr>`;
  }).join('') : `<tr class="noresults"><td colspan="${cols.length}">No records</td></tr>`;
  return `<div class="tablewrap"><table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead>`
    +`<tbody>${body}</tbody></table></div>`;
}

let calMonth='2026-09';
S.renewals=()=>{
  const [Y,M]=calMonth.split('-').map(Number);
  const first=new Date(Y,M-1,1), lead=first.getDay(), len=new Date(Y,M,0).getDate();
  const label=first.toLocaleString('en-GB',{month:'long',year:'numeric'});
  const inMonth=DB.docs.filter(x=>x.expiry.startsWith(calMonth));
  const cells=[...Array(lead)].map(()=>`<div class="day empty"></div>`);
  for(let day=1;day<=len;day++){
    const iso=`${calMonth}-${String(day).padStart(2,'0')}`;
    const ev=inMonth.filter(x=>x.expiry===iso).map(x=>{
      const t=toExpiry(x), k=t<30?'bad':t<=90?'warn':'ok';
      return `<div class="ev" data-act="renewalday" data-key="${x.id}">
        <i style="background:var(--${k})"></i><span>${x.name}</span></div>`;}).join('');
    cells.push(`<div class="day ${ev?'has':''}"><div class="num">${day}</div>${ev}</div>`);
  }
  const risk=['High','Medium','Low'].map(r=>{
    const band=x=>{const t=toExpiry(x);return t<30?0:t<=90?1:2;};
    const cells3=[0,1,2].map(bi=>{
      const list=DB.docs.filter(x=>x.risk===r&&band(x)===bi);
      return `<td>${list.length?list.map(x=>`<div style="margin-bottom:4px"><a class="link" data-act="opendoc" data-key="${x.id}">${x.name}</a></div>`).join(''):'—'}</td>`;
    }).join('');
    return `<tr><td><b>${r} risk</b></td>${cells3}</tr>`;
  }).join('');
  return head('Renewal Calendar',`${inMonth.length} renewals in ${label} · ${DB.docs.filter(x=>docState(x)==='Expiring').length} due within 90 days`,
    refreshB+exportB+newB('New Document','doc'))
  +`<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
     <div class="toggle"><button class="on" data-act="calview" data-v="cal">Calendar</button>
       <button data-act="calview" data-v="list">List</button>
       <button data-act="calview" data-v="risk">Risk Matrix</button></div>
     <span style="font-size:12px;color:var(--muted)">${b('&lt; 30 days','bad')} ${b('30–90 days','warn')} ${b('&gt; 90 days','ok')}</span>
    </div>
    <div id="calv" class="card cal">
     <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <button class="btn btn-ghost" data-act="calnav" data-n="-1">‹</button>
      <strong style="font-size:15px">${label}</strong>
      <button class="btn btn-ghost" data-act="calnav" data-n="1">›</button></div>
     <div class="calgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>
    </div>
    <div id="listv" style="display:none">${table(['Document','External Party','Expiry','Days to Expiry','Risk','Status','Owner','Action'],
      [...DB.docs].sort((a,z)=>a.expiry<z.expiry?-1:1).map(x=>({key:x.id,date:x.expiry,cells:[x.name,x.party,mono(x.expiry),
        daysB(toExpiry(x)),critB(x.risk),stB(docState(x)),x.owner,
        docLocked(x)?b('Closed','ok')+lockTag(true):mini('Renew','renew',`data-key="${x.id}"`)]})),{set:'docs'})}</div>
    <div id="riskv" style="display:none"><div class="tablewrap"><table>
      <thead><tr><th></th><th>Under 30 days</th><th>30 – 90 days</th><th>Over 90 days</th></tr></thead>
      <tbody>${risk}</tbody></table></div></div>`;
};

/* ---------------- filters ---------------- */
function rowHit(el,p){
  const tags=(el.dataset.tags||'').split('|').filter(Boolean);
  const txt=el.textContent.toLowerCase();
  return tags.includes(p)||(!tags.some(t=>t.includes(p))&&txt.includes(p));
}
function applyFilters(section){
  const f=section.querySelector('.filters'); if(!f) return;
  const q=(f.querySelector('[data-q]')?.value||'').trim().toLowerCase();
  const picks=[...f.querySelectorAll('select')].map(s=>s.value).filter(v=>!/^All /.test(v))
    .map(v=>v.toLowerCase().replace(/&amp;/g,'&'));
  const from=f.querySelector('[data-from]')?.value||'', to=f.querySelector('[data-to]')?.value||'';
  const tbody=section.querySelector('.tablewrap tbody');
  const items=[...(tbody?tbody.querySelectorAll('tr:not(.noresults)'):[]),...section.querySelectorAll('.grid4 .doc')];
  const live=picks.filter(p=>items.some(el=>rowHit(el,p)));
  const skipped=picks.length-live.length;
  let shown=0;
  items.forEach(el=>{
    const txt=el.textContent.toLowerCase(), dd=el.dataset.date||'';
    let ok=(!q||txt.includes(q))&&live.every(p=>rowHit(el,p));
    if(ok&&dd){if(from&&dd<from)ok=false;if(to&&dd>to)ok=false;}
    el.style.display=ok?'':'none'; if(ok)shown++;
  });
  if(tbody){
    tbody.querySelector('.noresults')?.remove();
    if(!shown){const cols=section.querySelectorAll('.tablewrap thead th').length;
      tbody.insertAdjacentHTML('beforeend',`<tr class="noresults"><td colspan="${cols}">No records match the current filters.</td></tr>`);}
  }
  const c=f.querySelector('[data-count]');
  if(c) c.textContent=`Showing ${shown} of ${items.length}`+(skipped?` · ${skipped} filter${skipped>1?'s':''} not held in this register`:'');
}
const main=document.getElementById('main');
['input','change'].forEach(ev=>main.addEventListener(ev,e=>{
  if(e.target.closest('.filters')) applyFilters(e.target.closest('.screen'));
}));
main.addEventListener('change',e=>{
  const sc=e.target.closest('.scope select');

let formCtx=null;
function openForm(entity,key){
  const cfg=FORMS[entity]; if(!cfg) return;
  const store=cfg.store, rec=key!=null&&key!==''?recOf(store,key):null;
  formCtx={entity,key:rec?key:null};
  const body=`<div class="form">${cfg.fields.map(f=>{
    const v=rec?(rec[f.k]??''):(f.def??'');
    const opts=typeof f.opts==='function'?f.opts():f.opts;
    const ctl=f.type==='select'
      ? `<select data-k="${f.k}">${['— select —',...opts].map(o=>`<option ${String(v)===o?'selected':''}>${o}</option>`).join('')}</select>`
      : `<input type="${f.type}" data-k="${f.k}" value="${String(v).replace(/"/g,'&quot;')}" placeholder="${f.type==='date'?'':f.label}">`;
    return `<div class="${f.wide?'wide':''}"><label>${f.label}${f.req?' *':''}</label>${ctl}</div>`;}).join('')}</div>
   ${entity==='comm'||entity==='legal'?`<div class="note">The <b>due date is calculated</b> from the SLA matrix
    for the chosen category and priority — you do not enter it.</div>`:''}`;
  openModal((rec?'Edit ':'New ')+cfg.title,rec?'Changes apply to the register immediately':'Saved into this session',
    body,`<button class="btn btn-primary" data-act="saveform">${rec?'Save Changes':'Create Record'}</button>
      <button class="btn btn-ghost" data-act="close">Cancel</button>`);
}
const recOf=(store,key)=>store==='comms'?commById(key):store==='docs'?DB.docs.find(x=>x.id===key)
  :store==='esc'?DB.esc.find(x=>x.id===key):DB[store][+key];
function readForm(){
  const o={};
  mBody.querySelectorAll('[data-k]').forEach(el=>{o[el.dataset.k]=el.value.startsWith('— select')?'':el.value.trim();});
  return o;
}
function nextCommId(){
  const n=Math.max(...DB.comms.map(c=>+c.id.split('-')[2]))+1;
  return 'COM-2026-'+String(n).padStart(4,'0');
}
function saveForm(){
  const {entity,key}=formCtx, cfg=FORMS[entity];
  const v=readForm();
  const missing=cfg.fields.filter(f=>f.req&&!v[f.k]).map(f=>f.label);
  if(missing.length) return toast('Required: '+missing.slice(0,2).join(', ')+(missing.length>2?` +${missing.length-2} more`:''));
  Object.assign(v,cfg.preset||{});
  if(entity==='comm'||entity==='legal'){
    if(key){const r=commById(key);Object.assign(r,v);r.due=addDays(r.rec,slaDays(r.cat,r.pri));
      logIt(r,'Record edited',TODAY+' — fields updated by administrator');}
    else{const r=c(nextCommId(),v.party,v.cat,v.subj,v.owner,v.sup,v.pri,v.rec,
        addDays(v.rec,slaDays(v.cat,v.pri)),'Open',v.bu,{caseRef:v.caseRef||''});
      DB.comms.unshift(r); notify('TMS',v.owner,'New Assignment',r.id);
      toast(`${r.id} created — due ${r.due} (${slaDays(v.cat,v.pri)} day SLA)`);}
  } else if(entity==='doc'){
    if(key) Object.assign(DB.docs.find(x=>x.id===key),v);
    else DB.docs.unshift(Object.assign({id:'DOC-2026-'+String(80+DB.docs.length+1)},v,{status:''}));
    if(!key) toast(`${v.name} added — ${toExpiry({expiry:v.expiry})} days to expiry`);
  } else if(entity==='file'){
    if(key) Object.assign(DB.files[+key],v);
    else {DB.files.unshift(Object.assign({icon:v.name.endsWith('.xlsx')?'📊':'📄'},v));
      const r=commById(v.rel); if(r) logIt(r,'Evidence uploaded',v.date+' — '+v.name);
      toast(`${v.name} archived against ${v.rel}`);}
  } else {
    const store=cfg.store;
    if(key!=null&&key!=='') Object.assign(DB[store][+key],v);
    else {DB[store].unshift(entity==='rule'?Object.assign({active:true},v):v);}
    if(!key) toast(`${cfg.title} created`);
  }
  if(key) toast(`${cfg.title} updated`);
  closeAll(); render();
}

  DB.notifs.unshift({when:TODAY+' '+new Date().toTimeString().slice(0,5),channel,to,event,rec,status});
}

const csvRow=a=>a.map(csvCell).join(',');
const visible=el=>el.style.display!=='none';

/* pull every data block out of the active screen: KPI cards, charts, tables,
   card grids, calendar markers and summary strips */
function collectSections(sec){
  const out=[], title=sec.querySelector('h1')?.textContent||current;

  const kpis=[...sec.querySelectorAll('.kpi')];
  if(kpis.length) out.push({name:'Key indicators',cols:['Indicator','Value','Detail'],
    rows:kpis.map(k=>[k.querySelector('.l')?.textContent,k.querySelector('.v')?.textContent,
      k.querySelector('.d')?.textContent])});

  const bars=[...sec.querySelectorAll('.bar')];
  if(bars.length) out.push({name:'Communications by category',cols:['Category','Records'],
    rows:bars.map(x=>[x.querySelector('span')?.textContent,x.querySelector('b')?.textContent])});

  const legend=[...sec.querySelectorAll('.legend div')];
  if(legend.length) out.push({name:'SLA compliance by business unit',cols:['Series'],
    rows:legend.map(x=>[x.textContent])});

  const links=[...sec.querySelectorAll('.quicklink')];
  if(links.length) out.push({name:'Quick actions',cols:['Count','Description'],
    rows:links.map(x=>[x.querySelector('.n')?.textContent,x.querySelector('.x')?.textContent])});

  sec.querySelectorAll('.tablewrap').forEach(tw=>{
    let name=title, prev=tw.previousElementSibling;
    while(prev&&!/^H2$/.test(prev.tagName)) prev=prev.previousElementSibling;
    if(prev) name=prev.textContent.trim();
    else if(tw.closest('.tabbody')) name=title+' — '+
      (sec.querySelector('.tabs button.on')?.textContent.trim()||'');
    else if(tw.closest('#listv')) name=title+' — list view';
    const cols=[...tw.querySelectorAll('thead th')].map(t=>t.textContent.trim()||'#');
    const rows=[...tw.querySelectorAll('tbody tr')]
      .filter(r=>visible(r)&&!r.classList.contains('noresults'))
      .map(r=>[...r.children].map(td=>td.textContent.trim()));
    if(rows.length) out.push({name,cols,rows});
  });

  const cards=[...sec.querySelectorAll('.grid4 .doc')].filter(visible);
  if(cards.length) out.push({name:'Document archive',cols:['File','Related record / date','Category'],
    rows:cards.map(x=>[x.querySelector('.dn')?.textContent,x.querySelector('.dm')?.textContent,
      x.querySelector('.badge')?.textContent])});

  const evs=[...sec.querySelectorAll('.day .ev')];
  if(evs.length) out.push({name:'Calendar markers',cols:['Day','Renewal'],
    rows:evs.map(x=>[x.closest('.day').querySelector('.num')?.textContent,x.textContent])});

  const sums=[...sec.querySelectorAll('.sumbar')];
  sums.forEach((s,i)=>out.push({name:'Summary'+(sums.length>1?' '+(i+1):''),cols:['Measure'],
    rows:[...s.querySelectorAll('span')].map(x=>[x.textContent])}));

  return out;
}
function activeFilters(sec){
  const f=sec.querySelector('.filters'); if(!f) return [];
  const out=[];
  const q=f.querySelector('[data-q]'); if(q&&q.value.trim()) out.push(['Search',q.value.trim()]);
  f.querySelectorAll('select').forEach(s=>{if(!/^All /.test(s.value)) out.push(['Filter',s.value]);});
  const a=f.querySelector('[data-from]'), z=f.querySelector('[data-to]');
  if(a&&z) out.push(['Date range',a.value+' to '+z.value]);
  return out;
}
let EXPORT=null;

function saveCSV(text,name){
  try{
    const blob=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; a.rel='noopener'; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
    return true;
  }catch(err){ return false; }
}
function copyText(text){
  const ta=document.getElementById('expText');
  try{
    if(ta){ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);}
    if(document.execCommand&&document.execCommand('copy')&&ta&&ta.value===text) return true;
  }catch(err){}
  try{
    const tmp=document.createElement('textarea');
    tmp.value=text; tmp.style.position='fixed'; tmp.style.opacity='0';
    document.body.appendChild(tmp); tmp.select();
    const ok=document.execCommand('copy'); tmp.remove();
    if(ok) return true;
  }catch(err){}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text);return true;}
  return false;
}
function exportCSV(){
  const sec=document.querySelector('.screen.active');
  if(!sec) return toast('Nothing to export');
  const sections=collectSections(sec);
  if(!sections.length) return toast('No data on this screen to export');
  const title=sec.querySelector('h1')?.textContent||current;
  const filters=activeFilters(sec);
  const headRows=[
    ['Andalusia Health Group — External Relations Control Tower'],
    ['Screen',title],
    ['Scope',`${SCOPE.bu} · ${SCOPE.region} · ${SCOPE.dept} · ${SCOPE.fn}`],
    ['Generated',TODAY+' '+new Date().toTimeString().slice(0,5)],
    ...filters];
  const csv=[], tsv=[];
  const push=r=>{csv.push(csvRow(r));tsv.push(r.map(v=>String(v??'').replace(/\s+/g,' ').trim()).join('\t'));};
  headRows.forEach(push); csv.push(''); tsv.push('');
  let rowCount=0;
  sections.forEach(s=>{
    push([s.name]); push(s.cols);
    s.rows.forEach(r=>{push(r);rowCount++;});
    csv.push(''); tsv.push('');
  });
  EXPORT={csv:csv.join('\r\n'),tsv:tsv.join('\n'),name:`${current}-${TODAY}.csv`,
    rows:rowCount,sections:sections.length,title};
  openModal('Export — '+title,
    `${rowCount} rows across ${sections.length} section${sections.length>1?'s':''}`
    +(filters.length?' · filters applied':''),
    `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      ${sections.map(s=>b(`${s.name} (${s.rows.length})`,'gray')).join(' ')}</div>
     <textarea id="expText" class="exportbox" readonly>${esc(EXPORT.csv)}</textarea>
     <div class="note"><b>Download</b> saves a UTF-8 CSV that opens directly in Excel.
     If this prototype is being viewed inside a preview frame the browser may block downloads —
     in that case use <b>Copy for Excel</b> and paste straight into a sheet, or select the text above.</div>`,
    `<button class="btn btn-primary" data-act="expDownload">Download CSV</button>
     <button class="btn btn-outline" data-act="expCopy" data-fmt="tsv">Copy for Excel</button>
     <button class="btn btn-outline" data-act="expCopy" data-fmt="csv">Copy CSV text</button>
     <button class="btn btn-ghost" data-act="close">Close</button>`);
}
function downloadFile(i){
  const x=DB.files[i];
  const body=`Andalusia Health Group — External Relations Control Tower\r\n`
    +`Prototype placeholder for: ${x.name}\r\nRelated record: ${x.rel}\r\n`
    +`Category: ${x.cat}\r\nUploaded ${x.date} by ${x.by}\r\nRetention: 7 years\r\n`;
  const blob=new Blob([body],{type:'text/plain;charset=utf-8;'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=x.name.replace(/\.[a-z]+$/,'')+'.txt'; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
  toast('Placeholder file downloaded');
}

/* ---------------- action registry ---------------- */
function guardComm(id){
  const r=commById(id);
  if(commLocked(r)){toast(`${r.id} is closed — reopen the record before editing`);return false;}
  return !!r;
}
const setStore=(path,v)=>{const [store,i,k]=path.split(':');DB[store][+i][k]=v;};

      table(['Week','Document','Department','Completed','Expiry'],
        weeklyCompletions().flatMap(w=>w.items.map(x=>({key:x.id,cells:[mono(w.week),x.name,
          b(x.dept,x.dept==='Insurance'?'gold':'info'),mono(x.done),mono(x.expiry)]}))))],
    renewals:['Renewals Due — '+K.ren,'Expiring within 90 days',table(['Document','Party','Expiry','Days','Risk','Owner'],
      DB.docs.filter(x=>docState(x)==='Expiring').map(x=>({key:x.id,
        cells:[x.name,x.party,mono(x.expiry),daysB(toExpiry(x)),critB(x.risk),x.owner]})))]}[k];
   openModal(m[0],m[1],m[2]);},
 drillcat:el=>{const c=el.dataset.cat, rows=DB.comms.filter(r=>r.cat===c);
   openModal(c+' Communications — '+rows.length,'Click a row to open the record',
     table(['CommID','Party','Subject','Owner','Status','SLA'],rows.map(r=>({key:r.id,
       cells:[r.id,r.party,r.subj,r.owner,stB(r.status),slaB(slaState(r))]}))));},

 calview:el=>{el.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));el.classList.add('on');
   ['cal','list','risk'].forEach(k=>document.getElementById(k+'v').style.display=k===el.dataset.v?'block':'none');},
 calnav:el=>{const [Y,M]=calMonth.split('-').map(Number);
   const nd=new Date(Y,M-1+ +el.dataset.n,1);
   calMonth=nd.toISOString().slice(0,7); render('renewals');},
 admintab:el=>{adminTab=+el.dataset.i;render('admin');},
 rpttab:el=>{rptTab=+el.dataset.i;render('reports');},
 powerbi:()=>toast('Opens the published report in the Power BI service'),
 reset:()=>{DB=seed();calMonth='2026-09';closeAll();render();toast('Demo data reset to the seed set');},
 'search-hdr':()=>toast('Use the search box on each register'),
 quickadd:()=>openForm('comm'),
 settings:()=>go('admin'),
 profile:()=>openModal('Hazem Gamal','Digital Transformation · Andalusia Health Group',
   `<dl class="kv"><dt>Module role</dt><dd>${b('Administrator','brown')} — full register and configuration access</dd>
     <dt>Business unit</dt><dd>Group – Head Office</dd><dt>Supervisor</dt><dd>Dr. Bassam Farid</dd>
     <dt>Acting owner in demo</dt><dd>${ME} (drives My Pending Actions)</dd></dl>`),
 help:()=>openModal('About this prototype','External Relations Control Tower · working stakeholder build',
   `<dl class="kv">
     <dt>Everything is live</dt><dd>Records you create, respond to, reassign, escalate, close, renew or delete
       persist for the session and flow through to the dashboard, escalation centre, notification log and audit views.</dd>
     <dt>Derived, not hard-coded</dt><dd>Due dates come from the SLA matrix; SLA status, days to expiry, KPI cards,
       charts and compliance percentages are all computed from the register.</dd>
     <dt>Not simulated</dt><dd>No email, Teams or TMS message leaves the browser, and nothing is written to a server.</dd>
     <dt>Closed records</dt><dd>A closed communication or a completed renewal cycle is <b>read only</b> —
       respond, reassign, escalate, edit and delete are withdrawn and the row carries a lock marker.
       An administrator can <b>Reopen</b> with a recorded reason, which is written to the activity log.</dd>
     <dt>Export</dt><dd>Every screen exports: indicators, charts, all tables including the escalation
       sections, card grids and summary bars, filtered exactly as shown. The preview window offers
       <b>Download CSV</b>, <b>Copy for Excel</b> (tab-separated, pastes into columns) and <b>Copy CSV text</b>.
       Use a copy option if the file is being viewed inside a preview frame, where browsers block downloads.</dd>
    </dl>`,
   `<button class="btn btn-outline" data-act="reset">Reset demo data</button>
    <button class="btn btn-ghost" data-act="close">Close</button>`)
};

/* one listener for the whole app */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a,e);return;}
  if(e.target.matches('input,select,textarea,label'))return;
  const tr=e.target.closest('tbody tr');
  if(tr&&!tr.classList.contains('noresults')&&!tr.closest('#modal')&&!tr.closest('#drawer')){
    const set=tr.dataset.set;
    if(set&&OPEN[set])return OPEN[set](tr.dataset.key);
    rowModal(tr);
  }
});

go('dashboard');
</script>
</body>
</html>
